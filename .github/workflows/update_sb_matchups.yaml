name: Update Matchups

on:
  # Zeitbasierte Ausführung
  schedule:
    # Freitag 00:00–05:55 UTC (entspricht 02:00–07:55 MESZ)
    - cron: "*/5 0-5 * * 5"

    # Sonntag 17:00–23:55 UTC (entspricht 19:00–01:55 MESZ)
    - cron: "*/5 17-23 * * 0"

    # Montag 00:00–02:55 UTC (ergänzt Sonntag-Nacht bis 05:55 MESZ)
    - cron: "*/5 0-2 * * 1"

    # Dienstag 00:00–05:55 UTC (entspricht 02:00–07:55 MESZ)
    - cron: "*/5 0-5 * * 2"

  # Manuelle Ausführung im GitHub-UI
  workflow_dispatch:

jobs:
  fetch-matchups:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cron_fetchmatchups.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cron_fetch_matchups.py
